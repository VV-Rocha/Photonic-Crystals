[project]
name = "Photonic-Crystals"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "arrayfire>=3.8.0",
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]